apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: tripgo-lab-05
  labels:
    app.kubernetes.io/managed-by: tripgoctl
    app.kubernetes.io/part-of: tripgo-local
    tripgo.course/lab: "05"
    tripgo.course/environment: tripgo-lab-05
  annotations:
    tripgo.course/generator-version: "v1.0.0"
    tripgo.course/cluster-id: "golden-cluster-id"
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: grafana, app.kubernetes.io/instance: tripgo-lab-05-grafana}
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: tripgoctl
        app.kubernetes.io/part-of: tripgo-local
        tripgo.course/lab: "05"
        tripgo.course/environment: tripgo-lab-05
        app.kubernetes.io/name: grafana
        app.kubernetes.io/instance: tripgo-lab-05-grafana
      annotations:
        tripgo.course/generator-version: "v1.0.0"
        tripgo.course/cluster-id: "golden-cluster-id"
    spec:
      securityContext:
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: docker.io/grafana/grafana@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Admin}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe: {httpGet: {path: /api/health, port: http}, periodSeconds: 3}
          livenessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 10}
          resources:
            requests: {cpu: 25m, memory: 96Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: grafana-data}
        - name: provisioning
          configMap: {name: grafana-provisioning}
---
