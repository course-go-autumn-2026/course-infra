apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: tripgo-lab-05
  labels:
    app.kubernetes.io/managed-by: tripgoctl
    app.kubernetes.io/part-of: tripgo-local
    tripgo.course/lab: "05"
    tripgo.course/environment: tripgo-lab-05
  annotations:
    tripgo.course/generator-version: "v1.0.0"
    tripgo.course/cluster-id: "golden-cluster-id"
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
    processors:
      batch: {}
    exporters:
      otlp/jaeger:
        endpoint: jaeger-otlp:4317
        tls: {insecure: true}
      prometheus:
        endpoint: 0.0.0.0:8889
    service:
      pipelines:
        traces: {receivers: [otlp], processors: [batch], exporters: [otlp/jaeger]}
        metrics: {receivers: [otlp], processors: [batch], exporters: [prometheus]}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: tripgo-lab-05
  labels:
    app.kubernetes.io/managed-by: tripgoctl
    app.kubernetes.io/part-of: tripgo-local
    tripgo.course/lab: "05"
    tripgo.course/environment: tripgo-lab-05
  annotations:
    tripgo.course/generator-version: "v1.0.0"
    tripgo.course/cluster-id: "golden-cluster-id"
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: otel-collector
        static_configs:
          - targets: [otel-collector-metrics:8889]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: tripgo-lab-05
  labels:
    app.kubernetes.io/managed-by: tripgoctl
    app.kubernetes.io/part-of: tripgo-local
    tripgo.course/lab: "05"
    tripgo.course/environment: tripgo-lab-05
  annotations:
    tripgo.course/generator-version: "v1.0.0"
    tripgo.course/cluster-id: "golden-cluster-id"
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: tripgo-lab-05
  labels:
    app.kubernetes.io/managed-by: tripgoctl
    app.kubernetes.io/part-of: tripgo-local
    tripgo.course/lab: "05"
    tripgo.course/environment: tripgo-lab-05
  annotations:
    tripgo.course/generator-version: "v1.0.0"
    tripgo.course/cluster-id: "golden-cluster-id"
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: otel-collector, app.kubernetes.io/instance: tripgo-lab-05-otel-collector}
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: tripgoctl
        app.kubernetes.io/part-of: tripgo-local
        tripgo.course/lab: "05"
        tripgo.course/environment: tripgo-lab-05
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/instance: tripgo-lab-05-otel-collector
      annotations:
        tripgo.course/generator-version: "v1.0.0"
        tripgo.course/cluster-id: "golden-cluster-id"
    spec:
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: otel-collector
          image: docker.io/otel/opentelemetry-collector-contrib@sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc
          args: [--config=/etc/otelcol/config.yaml]
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: prometheus, containerPort: 8889}
          readinessProbe:
            tcpSocket: {port: otlp-grpc}
            periodSeconds: 3
          livenessProbe:
            tcpSocket: {port: otlp-grpc}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol, readOnly: true}
      volumes:
        - name: config
          configMap: {name: otel-collector-config}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: tripgo-lab-05
  labels:
    app.kubernetes.io/managed-by: tripgoctl
    app.kubernetes.io/part-of: tripgo-local
    tripgo.course/lab: "05"
    tripgo.course/environment: tripgo-lab-05
  annotations:
    tripgo.course/generator-version: "v1.0.0"
    tripgo.course/cluster-id: "golden-cluster-id"
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: otel-collector, app.kubernetes.io/instance: tripgo-lab-05-otel-collector}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc, nodePort: 30505}
    - {name: otlp-http, port: 4318, targetPort: otlp-http, nodePort: 30506}
---
apiVersion: v1
kind: Service
