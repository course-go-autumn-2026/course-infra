apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: tripgo-lab-03
  labels:
    app.kubernetes.io/managed-by: tripgoctl
    app.kubernetes.io/part-of: tripgo-local
    tripgo.course/lab: "03"
    tripgo.course/environment: tripgo-lab-03
  annotations:
    tripgo.course/generator-version: "v1.0.0"
    tripgo.course/cluster-id: "golden-cluster-id"
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
    processors:
      batch: {}
    exporters:
      otlp/jaeger:
        endpoint: jaeger-otlp:4317
        tls: {insecure: true}
      prometheus:
        endpoint: 0.0.0.0:8889
      otlp_http/loki:
        endpoint: http://loki:3100/otlp
        sending_queue: {queue_size: 256}
        retry_on_failure: {max_elapsed_time: 5m}
    service:
      pipelines:
        traces: {receivers: [otlp], processors: [batch], exporters: [otlp/jaeger]}
        metrics: {receivers: [otlp], processors: [batch], exporters: [prometheus]}
        logs: {receivers: [otlp], processors: [batch], exporters: [otlp_http/loki]}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: tripgo-lab-03
  labels:
    app.kubernetes.io/managed-by: tripgoctl
    app.kubernetes.io/part-of: tripgo-local
    tripgo.course/lab: "03"
    tripgo.course/environment: tripgo-lab-03
  annotations:
    tripgo.course/generator-version: "v1.0.0"
    tripgo.course/cluster-id: "golden-cluster-id"
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: otel-collector
        static_configs:
          - targets: [otel-collector-metrics:8889]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: tripgo-lab-03
  labels:
    app.kubernetes.io/managed-by: tripgoctl
    app.kubernetes.io/part-of: tripgo-local
    tripgo.course/lab: "03"
    tripgo.course/environment: tripgo-lab-03
  annotations:
    tripgo.course/generator-version: "v1.0.0"
    tripgo.course/cluster-id: "golden-cluster-id"
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
      - name: Jaeger
        uid: jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686
        editable: false
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
        editable: false
        jsonData:
          derivedFields:
            - name: TraceID
              matcherType: label
              matcherRegex: trace_id
              datasourceUid: jaeger
              url: '$${__value.raw}'
              urlDisplayLabel: View trace
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: tripgo-lab-03
  labels:
    app.kubernetes.io/managed-by: tripgoctl
    app.kubernetes.io/part-of: tripgo-local
    tripgo.course/lab: "03"
    tripgo.course/environment: tripgo-lab-03
  annotations:
    tripgo.course/generator-version: "v1.0.0"
    tripgo.course/cluster-id: "golden-cluster-id"
data:
  loki.yaml: |
    auth_enabled: false
    analytics: {reporting_enabled: false}
    server:
      http_listen_port: 3100
    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore: {store: inmemory}
      # ponytail: single-node filesystem for labs; use object storage and replication for production.
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
    schema_config:
      configs:
        - from: "2020-10-24"
          store: tsdb
          object_store: filesystem
          schema: v13
          index: {prefix: index_, period: 24h}
    storage_config:
      tsdb_shipper:
        active_index_directory: /loki/index
        cache_location: /loki/index-cache
    ingester:
      wal:
        dir: /loki/wal
        replay_memory_ceiling: 128MB
        flush_on_shutdown: true
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      retention_delete_worker_count: 2
      delete_request_store: filesystem
    limits_config:
      allow_structured_metadata: true
      retention_period: 168h
      otlp_config:
        resource_attributes:
          ignore_defaults: true
          attributes_config:
            - action: index_label
              attributes: [service.name, service.namespace, deployment.environment, deployment.environment.name]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: tripgo-lab-03
  labels:
    app.kubernetes.io/managed-by: tripgoctl
    app.kubernetes.io/part-of: tripgo-local
    tripgo.course/lab: "03"
    tripgo.course/environment: tripgo-lab-03
  annotations:
    tripgo.course/generator-version: "v1.0.0"
    tripgo.course/cluster-id: "golden-cluster-id"
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: otel-collector, app.kubernetes.io/instance: tripgo-lab-03-otel-collector}
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: tripgoctl
        app.kubernetes.io/part-of: tripgo-local
        tripgo.course/lab: "03"
        tripgo.course/environment: tripgo-lab-03
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/instance: tripgo-lab-03-otel-collector
      annotations:
        checksum/config: 99b36640b01f3ccf92c557603b27a61821320284bda0a77716cfb988da80f466
        tripgo.course/generator-version: "v1.0.0"
        tripgo.course/cluster-id: "golden-cluster-id"
    spec:
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: otel-collector
          image: docker.io/otel/opentelemetry-collector-contrib@sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc
          args: [--config=/etc/otelcol/config.yaml]
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: prometheus, containerPort: 8889}
          readinessProbe:
            tcpSocket: {port: otlp-grpc}
            periodSeconds: 3
          livenessProbe:
            tcpSocket: {port: otlp-grpc}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol, readOnly: true}
      volumes:
        - name: config
          configMap: {name: otel-collector-config}
---
