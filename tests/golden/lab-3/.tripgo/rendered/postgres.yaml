apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: tripgo-lab-03
  labels:
    app.kubernetes.io/managed-by: tripgoctl
    app.kubernetes.io/part-of: tripgo-local
    tripgo.course/lab: "03"
    tripgo.course/environment: tripgo-lab-03
  annotations:
    tripgo.course/generator-version: "v1.0.0"
    tripgo.course/cluster-id: "golden-cluster-id"
type: Opaque
stringData:
  POSTGRES_DB: tripgo
  POSTGRES_USER: tripgo
  POSTGRES_PASSWORD: tripgo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: tripgo-lab-03
  labels:
    app.kubernetes.io/managed-by: tripgoctl
    app.kubernetes.io/part-of: tripgo-local
    tripgo.course/lab: "03"
    tripgo.course/environment: tripgo-lab-03
  annotations:
    tripgo.course/generator-version: "v1.0.0"
    tripgo.course/cluster-id: "golden-cluster-id"
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: tripgo-lab-03
  labels:
    app.kubernetes.io/managed-by: tripgoctl
    app.kubernetes.io/part-of: tripgo-local
    tripgo.course/lab: "03"
    tripgo.course/environment: tripgo-lab-03
  annotations:
    tripgo.course/generator-version: "v1.0.0"
    tripgo.course/cluster-id: "golden-cluster-id"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: tripgo-lab-03-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: tripgoctl
        app.kubernetes.io/part-of: tripgo-local
        tripgo.course/lab: "03"
        tripgo.course/environment: tripgo-lab-03
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: tripgo-lab-03-postgres
      annotations:
        tripgo.course/generator-version: "v1.0.0"
        tripgo.course/cluster-id: "golden-cluster-id"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/library/postgres@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, tripgo, -d, tripgo]
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            exec:
              command: [pg_isready, -U, tripgo, -d, tripgo]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: tripgo-lab-03
  labels:
    app.kubernetes.io/managed-by: tripgoctl
    app.kubernetes.io/part-of: tripgo-local
    tripgo.course/lab: "03"
    tripgo.course/environment: tripgo-lab-03
  annotations:
    tripgo.course/generator-version: "v1.0.0"
    tripgo.course/cluster-id: "golden-cluster-id"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: tripgo-lab-03-postgres
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: postgres
      nodePort: 30303
