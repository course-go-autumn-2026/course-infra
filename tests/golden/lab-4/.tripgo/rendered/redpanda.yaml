apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: tripgo-lab-04
  labels:
    app.kubernetes.io/managed-by: tripgoctl
    app.kubernetes.io/part-of: tripgo-local
    tripgo.course/lab: "04"
    tripgo.course/environment: tripgo-lab-04
  annotations:
    tripgo.course/generator-version: "v1.0.0"
    tripgo.course/cluster-id: "golden-cluster-id"
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: redpanda, app.kubernetes.io/instance: tripgo-lab-04-redpanda}
  ports:
    - {name: kafka, port: 9092, targetPort: kafka}
    - {name: admin, port: 9644, targetPort: admin}
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda-external
  namespace: tripgo-lab-04
  labels:
    app.kubernetes.io/managed-by: tripgoctl
    app.kubernetes.io/part-of: tripgo-local
    tripgo.course/lab: "04"
    tripgo.course/environment: tripgo-lab-04
  annotations:
    tripgo.course/generator-version: "v1.0.0"
    tripgo.course/cluster-id: "golden-cluster-id"
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: redpanda, app.kubernetes.io/instance: tripgo-lab-04-redpanda}
  ports:
    - {name: kafka-external, port: 19092, targetPort: kafka-external, nodePort: 30402}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: tripgo-lab-04
  labels:
    app.kubernetes.io/managed-by: tripgoctl
    app.kubernetes.io/part-of: tripgo-local
    tripgo.course/lab: "04"
    tripgo.course/environment: tripgo-lab-04
  annotations:
    tripgo.course/generator-version: "v1.0.0"
    tripgo.course/cluster-id: "golden-cluster-id"
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: redpanda, app.kubernetes.io/instance: tripgo-lab-04-redpanda}
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: tripgoctl
        app.kubernetes.io/part-of: tripgo-local
        tripgo.course/lab: "04"
        tripgo.course/environment: tripgo-lab-04
        app.kubernetes.io/name: redpanda
        app.kubernetes.io/instance: tripgo-lab-04-redpanda
      annotations:
        tripgo.course/generator-version: "v1.0.0"
        tripgo.course/cluster-id: "golden-cluster-id"
    spec:
      securityContext:
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redpanda
          image: docker.io/redpandadata/redpanda@sha256:468bd13a9f2bd24794cb7fddc867c767fb1008b9a07b297b89fde48c564d7d96
          args:
            - redpanda
            - start
            - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
            - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:24092
            - --rpc-addr=0.0.0.0:33145
            - --advertise-rpc-addr=redpanda-0.redpanda:33145
            - --mode=dev-container
            - --smp=1
            - --memory=512M
            - --reserve-memory=0M
            - --overprovisioned
            - --default-log-level=info
          ports:
            - {name: kafka, containerPort: 9092}
            - {name: kafka-external, containerPort: 19092}
            - {name: admin, containerPort: 9644}
            - {name: rpc, containerPort: 33145}
          readinessProbe: {httpGet: {path: /v1/status/ready, port: admin}, periodSeconds: 3}
          livenessProbe: {httpGet: {path: /v1/status/ready, port: admin}, initialDelaySeconds: 15}
          resources:
            requests: {cpu: 100m, memory: 640Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/redpanda/data}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/managed-by: tripgoctl
          app.kubernetes.io/part-of: tripgo-local
          tripgo.course/lab: "04"
          tripgo.course/environment: tripgo-lab-04
        annotations:
          tripgo.course/cluster-id: "golden-cluster-id"
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda-console
  namespace: tripgo-lab-04
  labels:
    app.kubernetes.io/managed-by: tripgoctl
    app.kubernetes.io/part-of: tripgo-local
    tripgo.course/lab: "04"
    tripgo.course/environment: tripgo-lab-04
  annotations:
    tripgo.course/generator-version: "v1.0.0"
    tripgo.course/cluster-id: "golden-cluster-id"
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: redpanda-console, app.kubernetes.io/instance: tripgo-lab-04-redpanda-console}
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: tripgoctl
        app.kubernetes.io/part-of: tripgo-local
        tripgo.course/lab: "04"
        tripgo.course/environment: tripgo-lab-04
        app.kubernetes.io/name: redpanda-console
        app.kubernetes.io/instance: tripgo-lab-04-redpanda-console
      annotations:
        tripgo.course/generator-version: "v1.0.0"
        tripgo.course/cluster-id: "golden-cluster-id"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 99
        runAsGroup: 99
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redpanda-console
          image: docker.redpanda.com/redpandadata/console@sha256:bf5ed3ee83e5b2dd6d1c1f1c8095ba252f384ce9354e7a3d2f780f0b4a486c09
          env:
            - {name: KAFKA_BROKERS, value: redpanda:9092}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe: {httpGet: {path: /admin/health, port: http}, periodSeconds: 3}
          livenessProbe: {httpGet: {path: /admin/health, port: http}, initialDelaySeconds: 10}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda-topic-reconciler
  namespace: tripgo-lab-04
  labels:
    app.kubernetes.io/managed-by: tripgoctl
    app.kubernetes.io/part-of: tripgo-local
    tripgo.course/lab: "04"
    tripgo.course/environment: tripgo-lab-04
  annotations:
    tripgo.course/generator-version: "v1.0.0"
    tripgo.course/cluster-id: "golden-cluster-id"
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: redpanda-topic-reconciler, app.kubernetes.io/instance: tripgo-lab-04-redpanda-topic-reconciler}
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: tripgoctl
        app.kubernetes.io/part-of: tripgo-local
        tripgo.course/lab: "04"
        tripgo.course/environment: tripgo-lab-04
        app.kubernetes.io/name: redpanda-topic-reconciler
        app.kubernetes.io/instance: tripgo-lab-04-redpanda-topic-reconciler
      annotations:
        tripgo.course/generator-version: "v1.0.0"
        tripgo.course/cluster-id: "golden-cluster-id"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: topic-reconciler
          image: docker.io/redpandadata/redpanda@sha256:468bd13a9f2bd24794cb7fddc867c767fb1008b9a07b297b89fde48c564d7d96
          command: [/bin/bash, /config/reconcile.sh]
          readinessProbe: {exec: {command: [/bin/test, -f, /tmp/topics-ready]}, periodSeconds: 3}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: redpanda-topics
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda-console
  namespace: tripgo-lab-04
  labels:
    app.kubernetes.io/managed-by: tripgoctl
    app.kubernetes.io/part-of: tripgo-local
    tripgo.course/lab: "04"
    tripgo.course/environment: tripgo-lab-04
  annotations:
    tripgo.course/generator-version: "v1.0.0"
    tripgo.course/cluster-id: "golden-cluster-id"
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: redpanda-console, app.kubernetes.io/instance: tripgo-lab-04-redpanda-console}
  ports:
    - {name: http, port: 8080, targetPort: http, nodePort: 30401}
