name: tripgoctl release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt a main publication halfway through uploading its assets.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Source checks
        run: |
          make proto-tools-install
          make source-check
      - name: Release metadata
        id: metadata
        run: |
          commit=$(git rev-parse HEAD)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=main-$commit" >> "$GITHUB_OUTPUT"
      - name: Build reproducible four-platform archives
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          COMMIT: ${{ steps.metadata.outputs.commit }}
        run: make release-repro-check SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tripgoctl-release
          path: build/release/
          if-no-files-found: error
          retention-days: 14
          overwrite: true
          compression-level: 0

  native:
    name: ${{ matrix.os }}/${{ matrix.arch }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: matrix.os == 'linux'
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tripgoctl-release
          path: build/release
      - name: Install and smoke-test the native archive
        env:
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ needs.build.outputs.commit }}
          EXPECTED_PLATFORM: ${{ matrix.os }}/${{ matrix.arch }}
        run: |
          case "$EXPECTED_PLATFORM:$(uname -s):$(uname -m)" in
            linux/amd64:Linux:x86_64|linux/arm64:Linux:aarch64|darwin/amd64:Darwin:x86_64|darwin/arm64:Darwin:arm64) ;;
            *) echo "runner does not match $EXPECTED_PLATFORM" >&2; exit 1 ;;
          esac
          make installer-test
          TRIPGOCTL_RELEASE_DIR="$PWD/build/release" \
            ./scripts/install-tripgoctl --install-dir "$RUNNER_TEMP/tripgoctl-bin" "$VERSION"
          cli="$RUNNER_TEMP/tripgoctl-bin/tripgoctl"
          case "$("$cli" version)" in
            "tripgoctl $VERSION (commit $COMMIT, built "*) ;;
            *) echo "unexpected build metadata" >&2; exit 1 ;;
          esac
          "$cli" --help
      - name: Install Linux runtime-check prerequisites
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq
      - name: Validate the same archive through Docker and kind
        if: matrix.os == 'linux'
        run: make release-platform-check
      - name: Safe runtime cleanup
        if: always() && matrix.os == 'linux'
        run: ./scripts/cleanup-release-check

  publish:
    needs: [build, native]
    if: >-
      github.repository == 'course-go-autumn-2026/course-infra' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tripgoctl-release
          path: build/release
      - name: Publish verified assets without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/publish-release
